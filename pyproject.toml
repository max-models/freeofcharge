[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools", "wheel" ]

[project]
name = "freeofcharge"
version = "0.1.0"
description = "Neutral beams in tokamak plasmas: deposition, shine-through and slowing down."
readme = "README.md"
keywords = [ "plasma", "tokamak", "neutral beam injection", "beam stopping", "fast ions" ]
license = { file = "LICENSE.txt" }
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "cunumpy",
  "maybempi>=0.1",
  "numpy",
  "plasmacoll>=0.2.0",
  "scipy",
  "simgeometry>=0.1.0",
  "xarray",
]
optional-dependencies.dev = [
  "jupyterlab",
  "pre-commit",
  "pyproject-fmt",
  "pyright",
  "ruff",
  "freeofcharge[docs,test]",
]
optional-dependencies.docs = [
  "freeofcharge[chain]",
  "griffe",
  "plasma-plots>=0.2.3",
  "ipykernel",
  "matplotlib>=3.10.9",
  "nbclient>=0.11",
  "nbformat>=5.11.1",
]
optional-dependencies.chain = [
  "tree-d-3d @ git+https://github.com/max-models/tree-d-3d@devel",
  "wellbalanced>=0.1.0",
]
optional-dependencies.test = [ "freeofcharge[chain]", "pytest", "pytest-cov" ]
urls.Source = "https://github.com/max-models/freeofcharge"

[tool.setuptools]
package-data."*" = [ "py.typed" ]
packages.find.where = [ "src" ]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-include = [ "*.ipynb" ]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear and pydocstyle
lint.select = [ "B", "D", "E", "F", "I", "UP", "W" ]
lint.ignore = [ "E501" ]  # line length is handled by the formatter
lint.per-file-ignores."**/tests/**" = [ "D" ]
lint.per-file-ignores."*.ipynb" = [ "D" ]
lint.per-file-ignores."docs/tools/*" = [ "D" ]
lint.pydocstyle.convention = "google"

[tool.pyright]
include = [ "src" ]
exclude = [ "**/tests" ]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest]
ini_options.pythonpath = [ "src" ]
ini_options.testpaths = [ "src" ]
ini_options.addopts = "-ra"

[tool.coverage]
run.omit = [ "*/tests/*" ]
run.source = [ "freeofcharge" ]
report.show_missing = true
