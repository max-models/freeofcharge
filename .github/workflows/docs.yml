name: Docs

# The Astro + Starlight site in docs/: hand-written pages, the executed notebooks and the API
# reference. Built on every push and pull request with the shared workflow of
# max-models/starlight-theme; deployed to GitHub Pages from devel.

on:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: max-models/starlight-theme/.github/workflows/docs.yml@v0
    with:
      node-version: "24"
      pre-build: uv run python docs/tools/examples.py
      smoke-paths: |
        getting-started/installation/index.html
        getting-started/quickstart/index.html
        examples/index.html
        examples/equilibrium-and-flux-surfaces/index.html
        examples/injector-design-scan/index.html
        examples/stellarator-injection/index.html
        example-scripts/index.html
        example-scripts/iter-like-injection/index.html
        example-scripts/injector-chain/index.html
        example-scripts/ascot5-benchmark/index.html
        benchmarks/ascot5/index.html
        api/freeofcharge/index.html
        api/freeofcharge/deposition/index.html
        examples/equilibrium-and-flux-surfaces/equilibrium_and_flux_surfaces.ipynb
        examples/stopping-and-shine-through/1.png
        example-scripts/iter-like-injection/plot-1.png
