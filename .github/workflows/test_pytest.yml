name: Test Pytest

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

env:
  # A PR to main or a push to main (the release) uses PyPI versions only; devel uses the
  # devel branches from [tool.uv.sources].
  UV_NO_SOURCES: ${{ (github.base_ref || github.ref_name) == 'main' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the GVEC build dependencies (GVEC has no Linux wheel)
        run: sudo apt-get update && sudo apt-get install -y gfortran cmake libblas-dev liblapack-dev libnetcdf-dev libnetcdff-dev

      - name: Install project
        run: uv sync --extra test

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false

  desc:
    # DESC (and JAX) only here: its tests compile for minutes, and its pins stay out of
    # the main jobs.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install the GVEC build dependencies (GVEC has no Linux wheel)
        run: sudo apt-get update && sudo apt-get install -y gfortran cmake libblas-dev liblapack-dev libnetcdf-dev libnetcdff-dev

      - name: Install project
        run: uv sync --extra test --extra desc

      - name: Run the DESC tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term src/freeofcharge/tests/unit/test_desc_equilibrium.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: desc
          fail_ci_if_error: false
